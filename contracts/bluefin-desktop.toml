# Runtime contract for the Plasma desktop on top of Hummingbird. This is
# intentionally separate from packages/bluefin.toml: package parity proves RPMs;
# this file proves OS identity, the Plasma desktop defaults Aurora's common
# image supplies, and first-boot Flatpak policy.

[branding]
files = [
  "/usr/share/plasma/look-and-feel/dev.getaurora.aurora.desktop/metadata.json",
  "/usr/share/plasma/look-and-feel/dev.getaurora.aurora.desktop/contents/layouts/org.kde.plasma.desktop-layout.js",
  "/usr/share/icons/hicolor/scalable/distributor-logo.svg",
  "/usr/share/backgrounds/default.xml",
  "/usr/share/ublue-os/fastfetch-user-count",
  "/usr/share/ublue-os/bazaar-install-count",
]

[branding.os_release]
NAME = "Utah"
ID = "utah"
ID_LIKE = "fedora"
CPE_NAME = "cpe:/o:universal-blue:utah"
HOME_URL = "https://projectbluefin.io"
DOCUMENTATION_URL = "https://docs.projectbluefin.io"
SUPPORT_URL = "https://github.com/projectbluefin/utah/issues/"
BUG_REPORT_URL = "https://github.com/projectbluefin/utah/issues/"
DEFAULT_HOSTNAME = "utah"
VERSION_CODENAME = "Utahraptor"
IMAGE_ID = "utah"

[branding.os_release_patterns]
PRETTY_NAME = '^Utah \(Version: .+\)$'
VERSION = '^.+ \(Hummingbird\)$'
VARIANT_ID = '^utah(-.*)?$'
OSTREE_VERSION = '^.+$'
IMAGE_VERSION = '^.+$'
BUILD_ID = '^.+$'

[branding.image_info]
image-name = "utah"
image-vendor = "projectbluefin"
base-image-name = "hummingbird"

[branding.image_info_patterns]
image-flavor = '^(main|nvidia|gaming|nvidia-gaming)$'
image-ref = '^ostree-image-signed:docker://ghcr\.io/projectbluefin/utah(-nvidia|-gaming|-nvidia-gaming)?$'
image-tag = '^.+$'
fedora-version = '^\d+$'

[configuration]
# Aurora's KDE defaults. kde-settings puts kde-profile/default/xdg on
# XDG_CONFIG_DIRS; these files override the ones kde-settings itself ships,
# which is why the Containerfile applies Aurora's image after the package
# transaction. The file_contains checks catch the RPM versions coming back.
files = [
  "/usr/share/kde-settings/kde-profile/default/xdg/kdeglobals",
  "/usr/share/kde-settings/kde-profile/default/xdg/ksplashrc",
  "/usr/lib/plasmalogin/defaults.conf",
]

[configuration.file_contains]
"/usr/share/kde-settings/kde-profile/default/xdg/kdeglobals" = [
  "LookAndFeelPackage=dev.getaurora.aurora.desktop",
]
"/usr/share/kde-settings/kde-profile/default/xdg/ksplashrc" = [
  "Theme=dev.getaurora.aurora.desktop",
]
"/usr/lib/plasmalogin/defaults.conf" = [
  "WallpaperPlugin=org.kde.image",
]

[flatpak]
files = [
  "/etc/flatpak/remotes.d/flathub.flatpakrepo",
  "/usr/share/flatpak/preinstall.d/bazaar.preinstall",
  "/usr/share/ublue-os/privileged-setup.hooks.d/99-flatpaks.sh",
  "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile",
]
brewfile = "/usr/share/ublue-os/homebrew/system-flatpaks.Brewfile"
remote = "/etc/flatpak/remotes.d/flathub.flatpakrepo"
remote_url = "https://dl.flathub.org/repo/"
# Aurora's default set, in the order of its system-flatpaks.Brewfile (Aurora's
# common image). The comparison is order-sensitive: this list is a parity
# assertion against that Brewfile, not a sorted catalogue.
apps = [
  "com.github.tchx84.Flatseal",
  "io.github.DenysMb.Kontainer",
  "io.github.flattool.Warehouse",
  "io.github.kolunmi.Bazaar",
  "io.missioncenter.MissionCenter",
  "org.deskflow.deskflow",
  "org.fedoraproject.MediaWriter",
  "org.fkoehler.KTailctl",
  "org.gnome.DejaDup",
  "org.gnome.Firmware",
  "org.gtk.Gtk3theme.Breeze",
  "org.kde.gwenview",
  "org.kde.haruna",
  "org.kde.kcalc",
  "org.kde.kclock",
  "org.kde.kontact",
  "org.kde.kweather",
  "org.kde.okular",
  "org.kde.qrca",
  "org.kde.skanpage",
  "org.mozilla.thunderbird",
  "org.mozilla.firefox",
]

[services]
enabled = [
  "bluetooth.service",
  "bootc-unified-storage.service",
  "brew-setup.service",
  "dconf-update.service",
  "flatpak-nuke-fedora.service",
  "flatpak-preinstall.service",
  "plasmalogin.service",
  "input-remapper.service",
  "ublue-system-setup.service",
  "uupd.timer",
]
# Per-user services, checked with `systemctl --global is-enabled`. Hummingbird's
# user preset disables everything but dbus; without these an installed Utah had
# no audio server. See user-preset/85-utah-desktop.preset.
user_enabled = [
  "pipewire.socket",
  "pipewire-pulse.socket",
  "wireplumber.service",
  "xdg-user-dirs.service",
]
masked = [
  "bootc-fetch-apply-updates.service",
  "bootc-fetch-apply-updates.timer",
  # Hummingbird's server kargs.d declares console=ttyS0, so the getty generator
  # spawns an agetty on a port desktop hardware does not have. It dies on EIO
  # and respawns every ~10s for the whole session; see #103.
  "serial-getty@ttyS0.service",
]
